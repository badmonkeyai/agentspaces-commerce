name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege for the default GITHUB_TOKEN: the build only reads.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Docs lint
        # The README's shape and the docs folder's index; the same script runs in
        # every public AgentSpaces repository.
        run: node tools/docs-lint.mjs .
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, test, and attach sources and javadoc
        # The AgentSpaces 0.6.0 artifacts (the BOM, agentspaces-api, and, for the
        # tests, agentspaces-common) resolve from Maven Central. The golden CBOR
        # vectors fail the build if a record's bytes change. The tests make fresh
        # P-256 keys and need no network. The publication profile runs unsigned
        # here, so a javadoc or packaging problem fails the pull request rather
        # than the release.
        run: mvn -B -ntp verify -Pcentral-publish -Dgpg.skip=true
